[package]
name = "voxelle"
version = "0.0.1"
description = "Voxelle — local, private-first offline dictation & voice AI."
authors = ["Voxelle"]
edition = "2021"
license = "Apache-2.0"

# Core logic lives in the library so tools (examples/asr_bench.rs) reuse exactly what the app runs.
[lib]
name = "voxelle_core"
path = "src/lib.rs"

[[bin]]
name = "voxelle"
path = "src/main.rs"

# GPU acceleration is opt-in at build time; CPU inference is always available at runtime.
[features]
default = []
gpu-vulkan = ["whisper-rs/vulkan"]
gpu-cuda = ["whisper-rs/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.18"
whisper-rs = "0.16"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
opt-level = "s"

[dev-dependencies]
hound = "3.5"
